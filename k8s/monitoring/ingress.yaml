# Grafana and Prometheus behind the same entry point as the app (reachable only through your SSM tunnel).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
spec:
  rules:
    - http:
        paths:
          - { path: /grafana, pathType: Prefix, backend: { service: { name: grafana, port: { number: 80 } } } }
          - { path: /prometheus, pathType: Prefix, backend: { service: { name: prometheus-server, port: { number: 80 } } } }
