# The Nordwind Grafana dashboard as code. Generated from JSON; edit in Grafana, export, paste here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nordwind-dashboards
  namespace: monitoring
data:
  nordwind-overview.json: |-
    {
      "uid": "nordwind-overview",
      "title": "Nordwind overview",
      "tags": [
        "nordwind"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "SLOs (last 30 days budget: 99.5% of chat answers succeed)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Chat success rate (1h)",
          "description": "SLO: 99.5% of chat requests end without an error. Stopped answers count as success.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(nordwind_chat_requests_total{status!=\"error\"}[1h])) / clamp_min(sum(rate(nordwind_chat_requests_total[1h])), 1e-9)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "p95 time to first token (1h)",
          "description": "SLO: 95% of answers show their first words within 5 seconds.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(nordwind_chat_time_to_first_token_seconds_bucket[1h])))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Documents waiting",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 4,
