apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nordwind
  labels: { app: api }
spec:
  replicas: 2 # never a single copy: one pod can restart while the other serves (case study R6)
  revisionHistoryLimit: 5 # enough history for "kubectl rollout undo"
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # zero-downtime deploys: start a new pod before stopping an old one (case study O5)
      maxSurge: 1
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets: [{ name: ecr-pull }]
      # Kubernetes would otherwise inject variables for every Service, e.g. a Service named "api" becomes
      # API_PORT=tcp://10.43.x.x:3000 and overwrites our own API_PORT setting. Use DNS names instead.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60 # time for streamed answers to finish after SIGTERM
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the "node" user in the image
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ${IMAGE_API}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NODE_ENV, value: production }
          envFrom:
            - secretRef: { name: nordwind-env } # built from AWS Parameter Store on every deploy, never in Git
          # Startup: up to 60s to boot. Liveness: only "is the process alive", never the DB or an AI provider
          # (case study R1). Readiness: "can I serve right now", checks the database only.
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Give the load balancer a moment to stop sending traffic before the app starts shutting down.
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          # Requests = what the scheduler reserves; memory limit = hard cap (case study R8).
          # No CPU limit on purpose: CPU limits cause throttling and latency spikes; requests are enough here.
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nordwind
  labels: { app: api }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
# Scale out on CPU: 2 to 4 pods (metrics-server is built into k3s).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: nordwind
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# Voluntary disruptions (node drain, upgrades) may never take the last API pod away.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: nordwind
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
