apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: nordwind
  labels: { app: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets: [{ name: ecr-pull }]
      # Kubernetes would otherwise inject variables for every Service, e.g. a Service named "api" becomes
      # API_PORT=tcp://10.43.x.x:3000 and overwrites our own API_PORT setting. Use DNS names instead.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the "nginx" user in nginx-unprivileged
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ${IMAGE_WEB}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # nginx writes its pid and temp files here
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nordwind
  labels: { app: web }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: nordwind
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: web }
