# The app runs under the strictest built-in Pod Security level: non-root, no privilege escalation,
# no extra Linux capabilities. Kubernetes refuses any pod in this namespace that breaks these rules.
apiVersion: v1
kind: Namespace
metadata:
  name: nordwind
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Prometheus and Grafana. Not "restricted": the node exporter needs host access to read machine metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
